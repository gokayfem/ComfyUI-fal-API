name: Refresh fal model registry

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/registry-refresh.yml"
      - "data/fal_registry.json"
      - "scripts/build_readme.py"
      - "scripts/build_registry.py"
      - "scripts/validate_registry.py"
      - "tests/test_registry_format.py"
      - "tests/test_validate_registry.py"
  schedule:
    # Daily, off the hour to avoid peak GitHub Actions scheduling delays.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      allow_large_change:
        description: Allow endpoint additions/removals above the automatic safety limits
        required: false
        default: false
        type: boolean

concurrency:
  group: fal-registry-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Validate and publish registry refresh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build candidate registry
        run: >-
          python scripts/build_registry.py
          --out data/fal_registry.next.json
          --preserve-from data/fal_registry.json

      - name: Validate candidate against the committed registry
        env:
          ALLOW_LARGE_CHANGE: ${{ inputs.allow_large_change || 'false' }}
        run: |
          args=(
            data/fal_registry.next.json
            --baseline data/fal_registry.json
            --max-removal-fraction 0.05
            --max-addition-fraction 0.25
          )
          if [[ "$ALLOW_LARGE_CHANGE" == "true" ]]; then
            args+=(--allow-large-change)
          fi
          python scripts/validate_registry.py "${args[@]}"

      - name: Promote candidate and regenerate model catalog
        run: |
          mv data/fal_registry.next.json data/fal_registry.json
          python scripts/build_readme.py

      - name: Run refresh safety checks
        run: |
          python -m pip install pytest
          python -m pytest tests/test_registry_format.py tests/test_validate_registry.py -q
          git diff --check

      - name: Commit and push changes
        run: |
          if git diff --quiet -- data/fal_registry.json MODELS.md; then
            echo "Registry is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fal_registry.json MODELS.md
          git commit -m "chore: refresh fal model registry"
          git pull --rebase origin main
          git push origin HEAD:main
